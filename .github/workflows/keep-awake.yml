# Render's free plan puts the site to sleep after 15 minutes without visitors; the next visitor
# then waits about 40 seconds on an English "Application loading" page. This calls the site every
# 10 minutes from 06:00 to 21:59 Thai time (23:00–14:59 UTC) so it stays awake while people use it.
# GitHub may run it a few minutes late, and turns it off if the repository has no commits for
# 60 days (turn it back on under Actions → Keep the site awake).
name: Keep the site awake

on:
  schedule:
    - cron: "*/10 23,0-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the site
        run: curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://nong-pla-too.onrender.com/api/health
