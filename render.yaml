# Render.com Blueprint — deploy the whole app (frontend + API) as one web service.
# https://render.com → New → Blueprint → connect this repo. Fill the secret
# values (marked "sync: false") in the Render dashboard after it creates the service.
services:
  - type: web
    name: nong-pla-too
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # --- ฐานข้อมูล TiDB (ตัวเดียวกับใน .env ของเครื่อง — ผ่าน migration 0000–0007 แล้ว) ---
      - key: DATABASE_URL
        sync: false
      # --- แชตบอต + เสียงพูด/ฟังของน้องปลาทู (Gemini) ---
      - key: GEMINI_API_KEY
        sync: false
      # --- บัญชีหลักเข้า /admin: ชื่อผู้ใช้ ADMIN_USERNAME (ค่าเริ่มต้น admin) + ADMIN_PASSWORD ---
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      # --- กุญแจเซ็น cookie ล็อกอิน (สุ่มให้อัตโนมัติ) ---
      - key: JWT_SECRET
        generateValue: true
      # --- (ไม่บังคับ) เส้นทางเดินจากนอกวิทยาลัยถึงประตู — OpenRouteService ---
      - key: ORS_API_KEY
        sync: false
